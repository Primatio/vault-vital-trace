services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: yarn start:dev
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # make file watching reliable across the bind mount
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    volumes:
      - ./src:/app/src
      - ./test:/app/test
      - ./nest-cli.json:/app/nest-cli.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
      # keep container node_modules, don't shadow with host
      - /app/node_modules
      # share your local `gcloud auth application-default login` credentials
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    restart: unless-stopped
