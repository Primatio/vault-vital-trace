name: vault_rppg_collector
description: Primatio Vault rPPG Collector — synchronized facial video + Polar H10 ground-truth for rPPG research.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  camera: ^0.12.0+2
  google_mlkit_face_detection: ^0.14.0
  polar: ^7.10.1
  permission_handler: ^12.0.3
  path_provider: ^2.1.6
  uuid: ^4.6.0
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  share_plus: ^13.3.0
  intl: ^0.20.3
  path: ^1.9.1
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
